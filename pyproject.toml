[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thiezer"
version = "0.3.0"
description = "Global surface-first astronomy travel recommendation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "h3>=4.2,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "reverse-geocoder>=1.5.1,<2",
  "skyfield>=1.54,<2",
  "skyfield-data>=7,<8",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "services/api/src"}

[tool.setuptools.packages.find]
where = ["services/api/src"]

[tool.setuptools.package-data]
"thiezer.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["thiezer"]
mypy_path = "services/api/src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["h3.*", "reverse_geocoder.*", "skyfield.*", "skyfield_data.*"]
ignore_missing_imports = true
