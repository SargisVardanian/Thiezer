name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format report
        id: ruff_format
        continue-on-error: true
        run: ruff format --check --diff . > ruff-format.diff
      - name: Upload Ruff format report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-report
          path: ruff-format.diff
      - name: Enforce Ruff format
        if: steps.ruff_format.outcome == 'failure'
        run: exit 1
      - name: Type check
        run: mypy services/api/src
      - name: Test
        run: pytest -q
