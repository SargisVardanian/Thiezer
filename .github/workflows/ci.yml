name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: |
          ruff format --diff . > /tmp/ruff-format.diff
          test ! -s /tmp/ruff-format.diff
      - name: Upload Ruff format report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-ruff-format
          path: /tmp/ruff-format.diff
      - name: Type check
        run: mypy services/api/src
      - name: Test
        run: pytest -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/flutter-analyze.txt
      - name: Upload Flutter analyze report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stabilization-flutter-analyze
          path: /tmp/flutter-analyze.txt
      - name: Test
        run: flutter test
