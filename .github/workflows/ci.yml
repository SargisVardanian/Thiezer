name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy report
        id: mypy
        continue-on-error: true
        run: mypy services/api/src --show-error-codes > mypy-report.txt
      - name: Upload Mypy report
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy-report.txt
      - name: Enforce Mypy
        if: steps.mypy.outcome == 'failure'
        run: exit 1
      - name: Test
        run: pytest -q
