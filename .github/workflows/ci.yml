name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Ruff lint report
        id: ruff_lint
        continue-on-error: true
        run: ruff check . --output-format=json > ruff-lint.json
      - name: Upload Ruff lint report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-lint-report
          path: ruff-lint.json
      - name: Enforce Ruff lint
        if: steps.ruff_lint.outcome == 'failure'
        run: exit 1
      - name: Ruff format
        run: ruff format --check .
      - name: Type check
        run: mypy services/api/src
      - name: Test
        run: pytest -q
