<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiezer Armenia | Daily Brief</title>
    <meta
      name="description"
      content="Thiezer Armenia is a multilingual Armenia news platform in Armenian, Russian, and English."
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <nav class="topbar">
          <div>
            <span class="brand-kicker">Thiezer Armenia</span>
            <p class="brand-subtitle" data-copy="navTagline"></p>
          </div>
          <div class="language-switcher" aria-label="Language switcher">
            <button class="lang-button is-active" type="button" data-lang="en">EN</button>
            <button class="lang-button" type="button" data-lang="ru">RU</button>
            <button class="lang-button" type="button" data-lang="hy">HY</button>
          </div>
        </nav>

        <section class="hero-grid">
          <div class="hero-copy">
            <p class="eyebrow" data-copy="eyebrow"></p>
            <h1 data-copy="heroTitle"></h1>
            <p class="hero-text" data-copy="heroText"></p>
            <div class="signal-strip" id="signal-strip"></div>
            <div class="hero-actions">
              <a class="primary-link" href="#briefing" data-copy="primaryCta"></a>
              <a class="secondary-link" href="#channels" data-copy="secondaryCta"></a>
            </div>
          </div>

          <aside class="hero-panel">
            <p class="panel-label" data-copy="todayLabel"></p>
            <h2 data-copy="todayHeadline"></h2>
            <p class="panel-text" data-copy="todayText"></p>
            <div class="hero-art-shell">
              <img class="hero-art" src="/hero-orbital.svg" alt="Thiezer Armenia editorial illustration" />
            </div>
            <ul class="metrics">
              <li>
                <strong>3</strong>
                <span data-copy="metricLanguages"></span>
              </li>
              <li>
                <strong>4</strong>
                <span data-copy="metricPlatforms"></span>
              </li>
              <li>
                <strong>Daily</strong>
                <span data-copy="metricCadence"></span>
              </li>
            </ul>
          </aside>
        </section>
      </header>

      <main>
        <section class="section" id="briefing">
          <div class="section-heading">
            <p class="section-kicker" data-copy="briefingKicker"></p>
            <h2 data-copy="briefingTitle"></h2>
            <p data-copy="briefingIntro"></p>
          </div>
          <div class="feature-story" id="feature-story"></div>
          <div class="news-grid" id="news-grid"></div>
        </section>

        <section class="section editorial-strip">
          <div>
            <p class="section-kicker" data-copy="workflowKicker"></p>
            <h2 data-copy="workflowTitle"></h2>
          </div>
          <ol class="workflow-list" id="workflow-list"></ol>
        </section>

        <section class="section" id="channels">
          <div class="section-heading">
            <p class="section-kicker" data-copy="channelsKicker"></p>
            <h2 data-copy="channelsTitle"></h2>
            <p data-copy="channelsIntro"></p>
          </div>
          <div class="channel-grid" id="channel-grid"></div>
        </section>

        <section class="section launch-board">
          <div class="section-heading">
            <p class="section-kicker" data-copy="launchKicker"></p>
            <h2 data-copy="launchTitle"></h2>
            <p data-copy="launchIntro"></p>
          </div>
          <div class="launch-grid" id="launch-grid"></div>
        </section>
      </main>

      <footer class="site-footer">
        <div>
          <span class="brand-kicker">Thiezer Armenia</span>
          <p class="brand-subtitle" data-copy="footerTagline"></p>
        </div>
        <div class="footer-contact" id="footer-contact"></div>
      </footer>
    </div>
  </body>
</html>
